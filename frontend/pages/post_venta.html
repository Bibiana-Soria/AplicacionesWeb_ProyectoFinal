<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Añadir Venta - Las Mezcladitas</title>
        <link rel="stylesheet" href="../css/global_styles.css">
        <link rel="stylesheet" href="../css/post.css">
        <link rel="stylesheet" href="../css/inventario_ventas.css">
    </head>
    <body>
        <aside class="sidebar">
            <div class="sidebar-logo">
            <img src="../img/logo.jpeg" alt="Logo">
            </div>
            <ul class="menu">
            <li><a href="dashboard.html">Inicio</a></li>
            <li><a href="inventario.html">Inventario</a></li>
            <li><a href="ventas.html">Ventas</a></li>
            <li id="menu_usuarios" style="display:none"><a href="admin_usuarios.html">Usuarios</a></li>
            <li class="logout" onclick="logOut()">Cerrar sesión</li>
            </ul>
        </aside>
        <div class="main">
            <header class="topbar">
                <h2>Añadir Venta</h2>
            </header>
            <label>Productos Disponibles</label>
            <div class="tabla-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Categoria</th>  
                            <th>Nombre</th>
                            <th>Marca</th>
                            <th>Descripcion</th>
                            <th>Precio</th>
                            <th>Stock</th>
                        </tr>
                    </thead>

                    <tbody id="tabla_inventario">
                    </tbody>
                </table>
            </div>
            <div class="campo">
                <label>ID Producto:  </label>
                <input type="number" id="id_producto" placeholder="Ingresar Producto">
            </div>
            <div class="campo">
                <label>Cantidad: </label>
                <input type="number" id="unidades_vendidas" placeholder="Ingresar unidades vendidas">
            </div>
           
            <button class="crear" onclick=crearVenta()>Añadir Venta</button>
        </div>
        <script src="../js/logout.js"></script>
        <script src="../js/post_venta.js"></script>
    </body>
</html>
